<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBank | Prihlásenie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .login-container { margin-top: 100px; max-width: 400px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #2c3e50; border: none; }
        .btn-primary:hover { background-color: #1a252f; }
        .btn-outline-secondary { border-color: #2c3e50; color: #2c3e50; }
        .btn-outline-secondary:hover { background-color: #2c3e50; color: #fff; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-container w-100">
        <div class="card p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">SafeBank 🏦</h2>
                <p class="text-muted">Zadajte údaje pre prístup k účtu</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Používateľské meno</label>
                    <input type="text" class="form-control" id="username" autocomplete="off" placeholder="napr. janko123" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Heslo</label>
                    <input type="password" class="form-control" id="password" autocomplete="off" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Prihlásiť sa</button>
            </form>

            <div class="mt-3 text-center">
                <small><a href="#" class="text-decoration-none">Zabudli ste heslo?</a></small>
            </div>
            <div class="mt-2 text-center">
                <small><a href="#" id="toggleFormLink" class="text-decoration-none">Nemáte účet? Zaregistrujte sa</a></small>
            </div>
        </div>
    </div>
</div>

<!-- Registration Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 15px; border: none; box-shadow: 0 8px 30px rgba(0,0,0,0.15);">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="registerModalLabel">Registrácia nového účtu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zavrieť"></button>
            </div>
            <div class="modal-body pt-2">
                <p class="text-muted small mb-3">Vyplňte údaje pre vytvorenie účtu. IBAN vám bude pridelený automaticky.</p>
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="regUsername" class="form-label">Používateľské meno</label>
                        <input type="text" class="form-control" id="regUsername" autocomplete="off" placeholder="napr. janko123" required>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Heslo</label>
                        <input type="password" class="form-control" id="regPassword" autocomplete="off" placeholder="********" required>
                    </div>
                    <div class="mb-3">
                        <label for="regBalance" class="form-label">Počiatočný zostatok (EUR)</label>
                        <input type="number" class="form-control" id="regBalance" min="0" step="0.01" placeholder="0.00" value="0">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Vytvoriť účet</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="login.js"></script>
</body>
</html>
