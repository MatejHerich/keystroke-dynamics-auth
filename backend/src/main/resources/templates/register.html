<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrácia | Banka</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<main class="container py-5" style="max-width: 480px;">

  <h1 class="h3 mb-1">Banka</h1>
  <p class="text-muted mb-4">Vytvorenie účtu</p>

  <div class="card shadow-sm">
    <div class="card-body p-4">

      <!-- The form is bound to the model attribute "registrationForm" (class RegistrationForm). -->
      <!-- novalidate: the browser does not check the fields, all rules are checked on the server. -->
      <form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate>

        <!-- General errors not tied to one field (bindingResult.reject in the controller). -->
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
          <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Pseudonym</label>
          <input type="text" id="username" th:field="*{username}" class="form-control"
                 th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                 autocomplete="username" autocapitalize="off" spellcheck="false">
          <div class="invalid-feedback" th:errors="*{username}"></div>
          <div class="form-text">Nezadávajte svoje skutočné meno.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Heslo</label>
          <input type="password" id="password" th:field="*{password}" class="form-control"
                 th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                 autocomplete="new-password">
          <div class="invalid-feedback" th:errors="*{password}"></div>
          <div class="form-text">
            Aspoň 8 znakov bez diakritiky.
          </div>
        </div>

        <div class="mb-4">
          <label for="passwordConfirm" class="form-label">Heslo znova</label>
          <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" class="form-control"
                 th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid'"
                 autocomplete="new-password">
          <div class="invalid-feedback" th:errors="*{passwordConfirm}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Vytvoriť účet</button>
      </form>

    </div>
  </div>

  <p class="text-center mt-3">
    Už máte účet? <a th:href="@{/login}">Prihláste sa</a>
  </p>

  <p class="text-center text-muted small mt-4">
    Výskumná aplikácia k bakalárskej práci. Nejde o skutočnú banku.
  </p>

</main>

</body>
</html>
