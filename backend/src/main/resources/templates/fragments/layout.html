<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Banka'">Banka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<a th:fragment="brand" class="brand" th:href="@{/}">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span>Banka</span>
</a>

<header th:fragment="topbar" class="topbar">
    <div class="container wrap topbar-inner">
        <a th:replace="~{fragments/layout :: brand}"></a>
        <div class="topbar-user">
            <span class="topbar-name" th:text="${username}">U01</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn-logout">Odhlásiť sa</button>
            </form>
        </div>
    </div>
</header>

</body>
</html>
