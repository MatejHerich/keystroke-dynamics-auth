<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrácia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="login.html">Banka</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Otvoriť menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="login.html">Prihlásenie</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="registration.html">Registrácia</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5 d-flex justify-content-center">
    <div class="card p-4" style="width: 100%; max-width: 380px;">
        <h1 class="h4 mb-3">Registrácia</h1>

        <form id="registration-form" autocomplete="off">
            <div class="mb-3">
                <label for="username" class="form-label">Používateľské meno</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Heslo</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3">
                <label for="password-confirm" class="form-label">Heslo znova</label>
                <input type="password" class="form-control" id="password-confirm" name="password-confirm" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Vytvoriť účet</button>
        </form>

        <p id="message" class="mt-3 mb-0 text-danger"></p>

        <p class="mt-3 mb-0">Už máš účet? <a href="login.html">Prihlás sa</a></p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/registration.js"></script>
</body>
</html>
