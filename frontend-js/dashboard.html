<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBank | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { background-color: #2c3e50; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .balance-amount { font-size: 2.5rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark p-3">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand fw-bold">SafeBank 🏦</span>
        <span class="text-white fw-medium" id="welcomeUser">Používateľ: Načítavam...</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card p-4 text-center h-100">
                <h5 class="text-muted fw-normal">Aktuálny zostatok</h5>
                <h2 class="text-success fw-bold balance-amount" id="balanceDisplay">--- €</h2>
                <p class="text-muted mt-3 mb-0 small">Číslo účtu:</p>
                <p class="fw-bold text-dark" id="ibanDisplay">SK-- ---- ---- ---- ---- ----</p>
            </div>
        </div>

        <div class="col-md-8 mb-4">
            <div class="card p-4 h-100">
                <h5 class="fw-bold mb-4">Nový bankový prevod</h5>

                <form id="transactionForm">

                    <div class="mb-3">
                        <label class="form-label text-muted">Príjemca (IBAN)</label>
                        <input
                                type="text"
                                class="form-control form-control-lg"
                                id="recipientIban"
                                placeholder="SK00 0000 0000 0000 0000 0000">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted">Suma v €</label>
                            <input
                                    type="number"
                                    step="0.01"
                                    class="form-control form-control-lg"
                                    id="amount"
                                    placeholder="0.00">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted">Variabilný symbol</label>
                            <input
                                    type="text"
                                    class="form-control form-control-lg"
                                    id="variableSymbol"
                                    placeholder="12345678">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted">Poznámka pre príjemcu</label>
                        <input
                                type="text"
                                class="form-control form-control-lg"
                                id="paymentNote"
                                placeholder="Napr. Darček">
                    </div>

                    <button
                            type="button"
                            class="btn btn-primary btn-lg w-100 py-3 fw-bold"
                            id="sendMoneyBtn"
                            style="background-color: #2c3e50;"
                            onclick="openPaymentModal()">
                        Autorizovať a odoslať platbu
                    </button>

                </form>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">História transakcií</h5>
                    <span class="text-muted small" id="transactionCount">Načítavam...</span>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Dátum</th>
                            <th>Príjemca</th>
                            <th>Popis</th>
                            <th class="text-end">Suma</th>
                        </tr>
                        </thead>
                        <tbody id="transactionHistoryBody">
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">Načítavam transakcie...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="paymentModal"
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
    <div style="background:#1e1e2f; width:400px; margin:100px auto; padding:20px; border-radius:10px; border: 1px solid #3d3d5c; text-align:center;">
        <h4 class="text-white">Biometrické overenie</h4>
        <p class="text-secondary">Pre potvrdenie platby napíšte frázu nižšie:</p>

        <p class="text-info fw-bold" id="phraseToType">potvrdzujem platbu</p>

        <input
                type="text"
                id="verificationInput"
                class="form-control mb-3"
                placeholder="Sem napíšte frázu..."
                autocomplete="off">

        <button class="btn btn-primary w-100" id="confirmPaymentBtn">
            Potvrdiť a odoslať
        </button>

        <button class="btn btn-link btn-sm text-secondary mt-2" onclick="closeModal()">
            Zrušiť
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
