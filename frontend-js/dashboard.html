<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>SafeBank | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { background-color: #2c3e50; }
        .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark p-3">
    <div class="container">
        <span class="navbar-brand fw-bold">SafeBank 🏦</span>
        <span class="text-white" id="welcomeUser">Používateľ: testuser</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h5 class="text-muted">Zostatok na účte</h5>
                <h2 class="text-success fw-bold">12 540,50 €</h2>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4">
                <h5 class="fw-bold">Nový prevod</h5>
                <hr>
                <div class="mb-3">
                    <label class="form-label">Číslo účtu (IBAN)</label>
                    <input type="text" class="form-control" placeholder="SK77 1100 0000 ...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Suma v €</label>
                    <input type="number" class="form-control" placeholder="0.00">
                </div>
                <button class="btn btn-primary w-100" id="sendMoneyBtn">Odoslať platbu</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
